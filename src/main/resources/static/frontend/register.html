<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - CabBooking</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">CabBooking MVP</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="card" style="max-width:620px;margin-inline:auto;">
    <h2 class="page-title">Register</h2>

    <label for="name">Name</label>
    <input id="name" placeholder="Alice" />

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="alice@test.com" />

    <label for="phone">Phone</label>
    <input id="phone" placeholder="0400000002" />

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="******" />

    <label for="role">Register as</label>
    <select id="role">
      <option value="RIDER">Passenger</option>
      <option value="DRIVER">Driver</option>
    </select>

    <button id="register-btn">Register</button>
    <p id="register-msg" class="message"></p>
  </div>
</main>

<script src="js/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
