<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passenger Dashboard - CabBooking</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Passenger Dashboard</div>
    <div class="nav-links">
      <a href="trip.html">Create Trip</a>
      <button class="link-btn" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main class="container">
  <div class="card">
    <h2 class="page-title">Passenger Info</h2>
    <div id="user-info"></div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <h3 style="margin:0;">My Trip History</h3>
      <button id="refresh-trips-btn" class="secondary">Refresh</button>
    </div>
    <div style="overflow-x:auto;margin-top:10px;">
      <table>
        <thead>
        <tr>
          <th>Trip ID</th>
          <th>Pickup</th>
          <th>Dropoff</th>
          <th>Status</th>
          <th>Driver</th>
          <th>Cab</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody id="passenger-trips-body"></tbody>
      </table>
    </div>
    <p id="passenger-msg" class="message"></p>
  </div>
</main>

<script src="js/axios.min.js"></script>
<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/passenger-dashboard.js"></script>
</body>
</html>
