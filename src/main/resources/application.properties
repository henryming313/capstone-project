spring.application.name=cabbooking-capstone-project

# Server Configuration
server.port=8081



spring.datasource.url=jdbc:mysql://localhost:3306/cabbooking_mvp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@1234



# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.centria.cabbooking=DEBUG
logging.level.org.hibernate=ERROR


springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.api-docs.paths-to-match=/v3/api-docs/**,/swagger-ui/**
